[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluation-harness"
version = "0.1.0"
description = "An OpenTelemetry and MLflow-based platform for sampling, normalizing, scoring, and reviewing AI agent traces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shengtao Lin" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
mlflow = ["mlflow==3.16.0"]
telemetry = ["opentelemetry-exporter-otlp-proto-http>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
dev = ["pyright>=1.1.380", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[project.scripts]
evaluation-harness-api = "evaluation_harness.api.app:run"
evaluation-harness-worker = "evaluation_harness.jobs.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_harness"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires PostgreSQL or MLflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
